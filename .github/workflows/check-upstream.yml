name: Check upstream BrowserOS release

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch: # manual trigger

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Check for new upstream release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Browser releases use plain v* tags (e.g. v0.47.18) and ship a BrowserOS_*_amd64.deb asset.
          # The repo also releases other products (BrowserClaw, claw-server, ext-agent, ...) that
          # dominate the recent releases list, so we paginate until we find a browser .deb release.

          RELEASE=""
          for page in 1 2 3 4 5; do
            RESPONSE=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/browseros-ai/BrowserOS/releases?per_page=100&page=$page")

            if [ "$(echo "$RESPONSE" | jq -r 'type')" != "array" ]; then
              echo "Unexpected GitHub API response. Skipping."
              exit 0
            fi

            [ "$(echo "$RESPONSE" | jq 'length')" = "0" ] && break

            MATCH=$(echo "$RESPONSE" | jq '[.[]
              | select(.tag_name | test("^v[0-9]"))
              | select(any(.assets[]; .name | startswith("BrowserOS_") and endswith("_amd64.deb")))
              ] | sort_by(.published_at) | last')

            if [ "$MATCH" != "null" ]; then
              RELEASE="$MATCH"
              break
            fi
          done

          if [ -z "$RELEASE" ]; then
            echo "No upstream browser release with a .deb asset found. Nothing to do."
            exit 0
          fi

          LATEST_TAG=$(echo "$RELEASE" | jq -r '.tag_name')
          LATEST_VERSION="${LATEST_TAG#v}"

          # Get .deb download URL
          DEB_URL=$(echo "$RELEASE" | jq -r '[.assets[] | select(.name | startswith("BrowserOS_") and endswith("_amd64.deb"))][0].browser_download_url')

          # Get current sha256 from our manifest (sha256 appears on the line before dest-filename)
          CURRENT_SHA=$(grep -B1 'dest-filename: browseros.deb' com.browseros.BrowserOS.yaml | grep sha256 | awk '{print $2}')

          # Download .deb and compute sha256
          echo "Downloading $DEB_URL ..."
          curl -sL -o /tmp/browseros.deb "$DEB_URL"
          NEW_SHA=$(sha256sum /tmp/browseros.deb | awk '{print $1}')

          echo "Upstream version: $LATEST_VERSION"
          echo "Current SHA256:   $CURRENT_SHA"
          echo "New SHA256:       $NEW_SHA"

          if [ "$CURRENT_SHA" = "$NEW_SHA" ]; then
            echo "Already up to date."
            exit 0
          fi

          # Update the manifest: replace URL and sha256
          sed -i "s|url: https://.*\.deb|url: $DEB_URL|" com.browseros.BrowserOS.yaml
          sed -i "s|sha256: $CURRENT_SHA|sha256: $NEW_SHA|" com.browseros.BrowserOS.yaml

          echo "Manifest updated to BrowserOS $LATEST_VERSION"

          # Commit and push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add com.browseros.BrowserOS.yaml
          git commit -m "Chore: Update BrowserOS to v$LATEST_VERSION"
          git push
